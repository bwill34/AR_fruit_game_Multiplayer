<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fruit Vocabulary AR Game - Multiplayer & BGM</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&display=swap');
        
        body {
            font-family: 'Mali', cursive;
            touch-action: none;
            overflow: hidden;
            background-color: #bae6fd;
        }

        .jelly-btn {
            border-radius: 30px;
            border: 4px solid white;
            box-shadow: 0 8px 0 rgba(0, 0, 0, 0.2);
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .jelly-btn:active, .jelly-btn.simulated-active {
            transform: translateY(8px) scale(0.98);
            box-shadow: 0 0px 0 rgba(0, 0, 0, 0.2);
        }

        @keyframes shake-wrong {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-15px) rotate(-5deg); }
            40%, 80% { transform: translateX(15px) rotate(5deg); }
        }
        .anim-shake { animation: shake-wrong 0.4s ease-in-out; }

        @keyframes pop-correct {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }
        .anim-pop { animation: pop-correct 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

        @keyframes float-bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        .anim-bounce { animation: float-bounce 2.5s infinite ease-in-out; }
        
        @keyframes float-fruit {
            0%, 100% { transform: translate(-50%, 0); }
            50% { transform: translate(-50%, -15px); }
        }
        .anim-fruit { animation: float-fruit 2.5s infinite ease-in-out; }

        .confetti {
            position: absolute;
            z-index: 100;
            pointer-events: none;
            transition: top 3s linear, transform 3s linear;
        }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
</head>
<body class="w-screen h-screen relative select-none">

    <video id="video-input" class="absolute w-0 h-0 opacity-0 pointer-events-none" autoplay playsinline muted></video>
    <canvas id="bg-canvas" class="absolute top-0 left-0 w-full h-full z-0 object-cover"></canvas>

    <div id="ar-cursor" class="fixed w-20 h-20 pointer-events-none z-[100] transform -translate-x-1/2 -translate-y-1/2 flex items-center justify-center opacity-0 transition-opacity duration-300">
        <span class="text-5xl drop-shadow-lg">✨</span>
        <svg class="absolute inset-0 w-full h-full" style="transform: rotate(-90deg);">
            <circle cx="40" cy="40" r="36" stroke="#ec4899" stroke-width="6" fill="none" stroke-linecap="round" stroke-dasharray="226" stroke-dashoffset="226" id="hover-ring" />
        </svg>
    </div>

    <div class="absolute inset-0 z-10 flex flex-col items-center justify-center pointer-events-none">
        
        <div id="screen-loading" class="flex flex-col items-center pointer-events-auto bg-white/90 p-8 rounded-[30px] border-4 border-white shadow-xl max-w-[90%] z-50">
            <div class="text-6xl mb-4 anim-bounce">🤖</div>
            <h1 class="text-3xl md:text-4xl font-bold text-sky-600 text-center mb-4">ระบบพร้อมแล้ว!</h1>
            <p class="text-lg text-gray-600 text-center mb-6">กรุณากดปุ่มด้านล่างเพื่อเปิดกล้อง</p>
            
            <button id="btn-request-camera" class="jelly-btn bg-green-500 text-white font-bold text-2xl md:text-3xl px-8 py-4 mb-2">
                📸 อนุญาตใช้กล้อง
            </button>
            <p id="camera-error-msg" class="text-red-500 text-center mt-2 hidden text-sm font-bold"></p>
        </div>

        <div id="screen-start" class="hidden flex-col items-center pointer-events-auto max-w-[90%]">
            <h1 class="text-5xl md:text-7xl font-bold text-white drop-shadow-[0_4px_4px_rgba(0,0,0,0.5)] mb-8 text-center bg-gradient-to-r from-pink-400 via-purple-400 to-sky-400 p-6 rounded-[30px] border-4 border-white leading-tight">
                Fruit Vocabulary<br><span class="text-3xl md:text-5xl text-yellow-200">เกมคำศัพท์ผลไม้ AR</span>
            </h1>
            <button id="btn-goto-mode" class="hand-interact jelly-btn bg-yellow-400 text-white font-bold text-4xl px-12 py-6">
                เริ่มเล่นเลย! 🎮
            </button>
        </div>

        <div id="screen-
